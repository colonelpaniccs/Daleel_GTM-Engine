<style>

    --font-ar: "Noto Naskh Arabic", "Noto Sans Arabic", "Segoe UI", "Geeza Pro", "Arial", sans-serif;
    --s: 1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-page);
    color: var(--text-primary);
    font-family: var(--font-sans);
    padding-inline: 24px;
    padding-block: calc(28px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px));
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .site-nav { display:flex; align-items:baseline; }

  .site-nav .brand:hover { color:var(--brand-orange); }
  .coming { min-height: calc(100svh - 150px); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .stage { position:relative; width:calc(600px * var(--s)); height:calc(540px * var(--s)); flex-shrink:0; }
  .stage-inner { position:absolute; left:0; top:0; width:600px; height:540px; transform:scale(var(--s)); transform-origin:0 0; }
  .coming h1 { margin:16px 0 0; font-family:var(--font-ar); font-size:48px; line-height:1.5; font-weight:400; color:var(--text-primary); }
  @media (max-width: 680px) { :root { --s: .6; } .coming h1 { font-size:34px; } }
  @media (max-width: 360px) { :root { --s: .52; } }

.bob{animation:bob 3.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.dallah{transform-origin:54.29% 56.18%;transform:rotate(-22deg);animation:tilt 5.6s infinite}
@keyframes tilt{
0%,12%{transform:rotate(-22deg);animation-timing-function:cubic-bezier(.45,0,.2,1)}
32%,68%{transform:rotate(-40deg);animation-timing-function:cubic-bezier(.45,0,.2,1)}
88%,100%{transform:rotate(-22deg)}}
.porc{fill:#ffffff;stroke:#e77f4d;stroke-width:1.6}
.band{fill:none;stroke:#e77f4d;stroke-width:3}
.ring-b{fill:none;stroke:#4a74a8;stroke-width:1.4}
.ring-o{fill:none;stroke:#e77f4d;stroke-width:1.1}
.rim{fill:none;stroke:#e77f4d;stroke-width:1.8}
.cup-in{fill:#f3ede4;stroke:#e77f4d;stroke-width:1.6}
.shadow{fill:#12243c;opacity:.07}
.coffee-still{fill:#c9922f}
.coffee{fill:#c9922f;transform-box:fill-box;transform-origin:50% 50%;animation:fill 5.6s infinite}
@keyframes fill{0%,40%{transform:translateY(4px) scale(0)}66%,88%{transform:translateY(0) scale(1)}95%,100%{transform:translateY(4px) scale(0)}}
.stream,.stream-hi{fill:none;stroke-linecap:round;stroke-dasharray:125.4 125.4;stroke-dashoffset:125.4;animation:pour 5.6s linear infinite}
.stream{stroke:#c68a2b;stroke-width:3.6}
.stream-hi{stroke:#f2cf73;stroke-width:1.2;opacity:.85}
@keyframes pour{0%,33%{stroke-dashoffset:125.4}40%,66%{stroke-dashoffset:0}72%,100%{stroke-dashoffset:-125.4}}
.splash{opacity:0;animation:splash 5.6s infinite}
.splash-l{fill:none;stroke:#b8801f;stroke-width:1.6;stroke-linecap:round}
@keyframes splash{0%,39%{opacity:0}41%{opacity:.9}47%,100%{opacity:0}}
.steam{fill:none;stroke:#cfc3b2;stroke-width:2.4;stroke-linecap:round;opacity:0;animation:steam 5.6s infinite}
.steam.s2{animation-name:steam2}
@keyframes steam{0%,62%{opacity:0;transform:translateY(0)}70%{opacity:.55}92%,100%{opacity:0;transform:translateY(-14px)}}
@keyframes steam2{0%,66%{opacity:0;transform:translateY(0)}74%{opacity:.55}92%,100%{opacity:0;transform:translateY(-14px)}}
.steam-c{fill:none;stroke:#d8cfc2;stroke-width:1.8;stroke-linecap:round;opacity:0;animation:steamc 3.4s ease-in-out infinite}
.steam-c.c2{animation-delay:-1.7s}
@keyframes steamc{0%{opacity:0;transform:translateY(2px)}30%{opacity:.4}75%{opacity:.12}100%{opacity:0;transform:translateY(-11px)}}
.ar-x{font-family:"Noto Naskh Arabic","Noto Sans Arabic","Segoe UI","Geeza Pro","Arial",sans-serif}
@media (prefers-reduced-motion: reduce){
.bob,.dallah,.coffee,.stream,.stream-hi,.splash,.steam,.steam-c{animation:none}.steam-c{opacity:.3}
.dallah{transform:rotate(-40deg)}.stream,.stream-hi{stroke-dashoffset:0}.coffee{transform:none}}
</style>
